services:
  - type: web
    name: nebula-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MSG_TTL_MS
        value: "300000"
      - key: STORY_TTL_MS
        value: "1800000"
      - key: POST_TTL_MS
        value: "900000"
      - key: TENOR_API_KEY
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
